[workspace]
members = [
  "apps/desktop/src-tauri",
  "bins/native-host",
  "bins/pdf-renderer",
  "crates/app-core",
  "crates/cms-signing",
  "crates/deployment-config",
  "crates/local-ipc",
  "crates/protocol",
  "crates/request-validation",
  "crates/safe-logging",
  "crates/windows-certificates",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Proprietary"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "warn"
