[package]
name = "inkwell-desktop"
description = "Inkwell Desktop Tauri application"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "inkwell_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
inkwell-app-core = { path = "../../../crates/app-core" }
inkwell-deployment-config = { path = "../../../crates/deployment-config" }
inkwell-local-ipc = { path = "../../../crates/local-ipc" }
inkwell-protocol = { path = "../../../crates/protocol" }
serde.workspace = true
tauri = { version = "2.8", features = [] }
tauri-plugin-single-instance = "2.3"
zeroize.workspace = true

[dev-dependencies]
base64.workspace = true
inkwell-native-host = { path = "../../../bins/native-host" }
serde_json.workspace = true
sha2.workspace = true

[lints]
workspace = true
